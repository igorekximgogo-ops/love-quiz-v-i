<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff4f6" />
    <title>Для тебя ❤️</title>
    <link rel="stylesheet" href="style.css?v=7" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-live="polite">
        <div class="sparkle sparkle-one" aria-hidden="true">✦</div>
        <div class="sparkle sparkle-two" aria-hidden="true">♡</div>
        <div class="floating-hearts" id="floating-hearts" aria-hidden="true">
          <span class="floating-heart heart-one">♥</span>
          <span class="floating-heart heart-two">♥</span>
          <span class="floating-heart heart-three">♥</span>
          <span class="floating-heart heart-four">♥</span>
          <span class="floating-heart heart-five">♥</span>
          <span class="floating-heart heart-six">♥</span>
          <span class="floating-heart heart-seven">♥</span>
          <span class="floating-heart heart-eight">♥</span>
        </div>

        <div class="quiz" id="quiz">
          <p class="eyebrow">маленький вопросик для тебя</p>
          <div class="progress" id="progress">Вопрос 1 из 5</div>
          <h1 class="question" id="question"></h1>
          <div class="button-arena" id="button-arena">
            <button class="answer answer-yes" id="yes-button" type="button">
              Да 💗
            </button>
            <button class="answer answer-no" id="no-button" type="button">
              Нет 🙈
            </button>
          </div>
        </div>

        <div class="ending" id="ending" hidden>
          <div class="heart" aria-label="Сердце с надписью В плюс И">
            <img class="heart-image" src="heart-kitten.jpg" alt="Котёнок уютно устроился на большом розовом сердце" />
            <span>В+И</span>
          </div>
          <p class="love-note">I love you</p>
          <p class="ending-caption">и это только начало нашей истории 💕</p>
        </div>
      </section>
      <p class="footer-note">сделано с любовью Игорем ✨</p>
    </main>
  </body>
</html>
